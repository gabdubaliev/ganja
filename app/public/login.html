<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Вход — Мой магазин</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css" id="theme-css">

</head>
<body>
<main class="login-page">
  <form class="login-card" id="login-form" novalidate>
    <div class="login-badge" id="login-badge" aria-hidden="true">М</div>
    <div>
      <h1>Мой магазин</h1>
      <p class="sub">Войдите, чтобы открыть программу.</p>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" class="input big" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" class="input big" autocomplete="current-password" required>
    </div>
    <p class="form-error" id="login-error" role="alert" hidden></p>
    <button type="submit" class="btn primary big">Войти</button>
  </form>
  <form class="login-card" id="code-form" novalidate hidden>
    <div class="login-badge" aria-hidden="true">🔐</div>
    <div>
      <h1>Код из Telegram</h1>
      <p class="sub">Бот прислал вам код из 6 цифр. Введите его, чтобы войти.</p>
    </div>
    <div class="field">
      <label for="code">Код</label>
      <input id="code" name="code" class="input big num" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
    </div>
    <label class="check"><input type="checkbox" name="remember" checked> Запомнить это устройство на 30 дней</label>
    <p class="form-error" id="code-error" role="alert" hidden></p>
    <button type="submit" class="btn primary big">Войти</button>
    <button type="button" class="btn ghost" id="code-again">Прислать код ещё раз</button>
  </form>
</main>
<script>

// Масштаб страницы не меняется: iPhone не слушает user-scalable=no, поэтому жесты «щипок» гасим сами.
for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', (e) => { if (e.scale !== undefined && e.scale !== 1) e.preventDefault(); }, { passive: false });
// Название магазина из раздела «Оформление».
fetch('/api/brand').then((r) => r.json()).then((b) => {
  document.querySelector('h1').textContent = b.name;
  document.getElementById('login-badge').textContent = (b.name.trim()[0] || 'М').toUpperCase();
  document.title = 'Вход — ' + b.name;
}).catch(() => {});
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const error = document.getElementById('login-error');
  const button = e.target.querySelector('button');
  button.disabled = true;
  error.hidden = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: e.target.elements.email.value, password: e.target.elements.password.value }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.need2fa) return askCode(data.token);
    if (res.ok) return location.replace('/');
    error.textContent = data.error || 'Не получилось войти';
  } catch {
    error.textContent = 'Нет связи с сервером. Проверьте интернет.';
  }
  error.hidden = false;
  button.disabled = false;
  e.target.elements.password.select();
});

// Второй шаг для владельца: код из Telegram.
let codeToken = '';
function askCode(token) {
  codeToken = token;
  document.getElementById('login-form').hidden = true;
  const f = document.getElementById('code-form');
  f.hidden = false;
  f.elements.code.value = '';
  document.getElementById('code-error').hidden = true;
  f.elements.code.focus();
}
function backToPassword(msg) {
  const lf = document.getElementById('login-form');
  document.getElementById('code-form').hidden = true;
  lf.hidden = false;
  lf.querySelector('button').disabled = false;
  const error = document.getElementById('login-error');
  error.textContent = msg;
  error.hidden = !msg;
  lf.elements.password.select();
}
document.getElementById('code-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const error = document.getElementById('code-error');
  const button = f.querySelector('button[type=submit]');
  button.disabled = true;
  error.hidden = true;
  try {
    const res = await fetch('/api/login/2fa', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: codeToken, code: f.elements.code.value, remember: f.elements.remember.checked }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) return location.replace('/');
    if (data.restart) return backToPassword(data.error);
    error.textContent = data.error || 'Неверный код';
  } catch {
    error.textContent = 'Нет связи с сервером. Проверьте интернет.';
  }
  error.hidden = false;
  button.disabled = false;
  f.elements.code.select();
});
document.getElementById('code-form').elements.code.addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
  if (e.target.value.length === 6) e.target.form.requestSubmit();
});
// Новый код: ещё раз тот же вход по паролю (пароль ещё в форме).
document.getElementById('code-again').addEventListener('click', () => document.getElementById('login-form').requestSubmit());
</script>
</body>
</html>
