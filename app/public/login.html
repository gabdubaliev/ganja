<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Вход — Мой магазин</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css" id="theme-css">

</head>
<body>
<main class="login-page">
  <form class="login-card" id="login-form" novalidate>
    <div class="login-badge" id="login-badge" aria-hidden="true">М</div>
    <div>
      <h1>Мой магазин</h1>
      <p class="sub">Войдите, чтобы открыть программу.</p>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" class="input big" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" class="input big" autocomplete="current-password" required>
    </div>
    <p class="form-error" id="login-error" role="alert" hidden></p>
    <button type="submit" class="btn primary big">Войти</button>
  </form>
</main>
<script>

// Масштаб страницы не меняется: iPhone не слушает user-scalable=no, поэтому жесты «щипок» гасим сами.
for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', (e) => { if (e.scale !== undefined && e.scale !== 1) e.preventDefault(); }, { passive: false });
// Название магазина из раздела «Оформление».
fetch('/api/brand').then((r) => r.json()).then((b) => {
  document.querySelector('h1').textContent = b.name;
  document.getElementById('login-badge').textContent = (b.name.trim()[0] || 'М').toUpperCase();
  document.title = 'Вход — ' + b.name;
}).catch(() => {});
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const error = document.getElementById('login-error');
  const button = e.target.querySelector('button');
  button.disabled = true;
  error.hidden = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: e.target.elements.email.value, password: e.target.elements.password.value }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) return location.replace('/');
    error.textContent = data.error || 'Не получилось войти';
  } catch {
    error.textContent = 'Нет связи с сервером. Проверьте интернет.';
  }
  error.hidden = false;
  button.disabled = false;
  e.target.elements.password.select();
});
</script>
</body>
</html>
